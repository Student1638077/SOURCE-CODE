<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Basket Chain</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
             <a href="c:\Users\Owner\Desktop\BASKET CHAIN SOURCE DATA\agro-landing-page\index.html" class="btn-home">
                <i class="fas fa-arrow-left"></i> Home
            </a>
            <div class="brand-name">Basket Chain</div>
            <div class="header-spacer"></div>
        </header>

        <main class="main-content">
            <div class="container">
                <!-- Left Side: Form -->
                <div class="form-section">
                    <div class="form-card">
                        <h1>Welcome <span>Back</span></h1>
                        <p class="subtitle">Log in to your buyer account to continue sourcing quality produce</p>

                        <form id="loginForm">
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Enter your email" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" placeholder="Enter your password" required>
                                <a href="#" class="forgot-password">Forgot Password?</a>
                            </div>

                            <div class="form-checkbox">
                                <input type="checkbox" id="remember">
                                <label for="remember">Remember me</label>
                            </div>

                            <button type="submit" class="btn-submit">Log In</button>

                            <p class="signup-link">New User? <a href="../../agro-signup-page/index.html">Sign Up</a></p>
                        </form>
                    </div>
                </div>

                <!-- Right Side: Image & Testimonial -->
                <div class="visual-section">
                    <div class="image-container">
                        <div class="img-placeholder">
                               <img src="./assets/images/image-removebg-preview 1.png" alt="#dashboard-image" style="width: 100%; height: 100%;">
                        </div>
                    </div>
                    <div class="testimonial">
                        <blockquote>“Finding quality suppliers has never been easier!”</blockquote>
                        <cite>Richmond R.</cite>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
